[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-prune-yolo"
version = "0.1.0"
description = "YOLOv8n structured pruning experiments for DeepPCB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "ultralytics==8.4.115",
    "opencv-python==4.13.0.92",
    "PyYAML==6.0.3",
    "pandas==2.3.3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torch_pruning = ["LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
