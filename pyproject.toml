[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-prune-yolo"
version = "0.1.0"
description = "YOLOv8n structured pruning experiments for DeepPCB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "ultralytics", "torch-pruning", "PyYAML", "Pillow", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

